<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>ScoreKeeper</h1>
        <div class="controls">
          <button id="newGame" onclick="newGame()">New Game</button>
          <button id="historyBtn">History</button>
        </div>
      </header>

      <section id="gameSetup">
        <h2>Select Game Type</h2>
        <button onclick="soloPlayerGame()">
          <img
            src="./Assests/—Pngtree—battle player 1 vs 2_5982389.png"
            alt="One Vs One"
          />
        </button>
        <button onclick="teamGame()">
          <img
            src="./Assests/—Pngtree—team 1 vs 2 sports_6010892.png"
            alt="Team Vs Team"
          />
        </button>
      </section>
      <section class="closeSession">
        <img src="./Assests/close.png" alt="Close" onclick="closeSession()" />
      </section>
      <section id="addingPlayers">
        <!-- for one vs one  -->
        <div class="soloGame">
          <input
            type="text"
            required
            minlength="3"
            placeholder="Please add the first player's name."
            id="soloOne"
          />
          <div class="vsImage">
            <img src="./Assests/generated-image.png" alt="VS" class="vs" />
          </div>
          <input
            type="text"
            required
            minlength="3"
            placeholder="Please add the second player's name."
            id="soloTwo"
          />
        </div>
        <!-- for team vs team game  -->
        <div class="teamGame">
          <div class="teams">
            <h3>Team One</h3>
            <input
              type="text"
              required
              minlength="3"
              placeholder="Please add the first player's name."
              id="teamOneFirst"
            />
            <input
              type="text"
              required
              minlength="3"
              placeholder="Please add the second player's name."
              id="teamOneSecond"
            />
          </div>
          <div class="vsImage">
            <img src="./Assests/generated-image.png" alt="VS" class="vs" />
          </div>
          <div class="teams">
            <h3>Team Two</h3>
            <input
              type="text"
              required
              minlength="3"
              placeholder="Please add the first player's name."
              id="teamTwoFirst"
            />
            <input
              type="text"
              required
              minlength="3"
              placeholder="Please add the second player's name."
              id="teamTwoSecond"
            />
          </div>
        </div>
        <input
          type="number"
          required
          placeholder="Please add the number of points"
          class="points"
        />
        <br />
        <button class="start" onclick="addPlayersName()">Start Game</button>
      </section>
      <section id="scoreboard" hidden>
        <div id="scoreDetails">
          <p class="gameIDShow">Game ID: <span id="gameIDDisplay"></span></p>
          <p>
            In a
            <span id="pointsGame"></span>-points game, the
            <span id="pointsGameType"></span> needs
            <span id="pointsToWin"></span> points to win.
          </p>
          <div class="player playerA">
            <h2>
              <span id="addTypeOne"></span> A -
              <span id="addNameOne"></span>
            </h2>
            <button
              class="add"
              id="addPointToA"
              value="sideAPoints"
              onclick="scoreCounter(event)"
            >
              +1
            </button>
          </div>
          <p class="scoreVS">V/S</p>
          <div class="player playerB">
            <h2>
              <span id="addTypeTwo">Team/Player</span> B -
              <span id="addNameTwo">Name</span>
            </h2>
            <button
              class="add"
              id="addPointToB"
              value="sideBPoints"
              onclick="scoreCounter(event)"
            >
              +1
            </button>
          </div>
          <div class="infoElements">
            <button class="winning">Winning</button>
            <button class="scoreLevel">Score Level</button>
            <button class="losing">Losing</button>
          </div>
          <div class="scoreControls">
            <button id="undoBtn" onclick="undoLastPoint()">Undo</button>
            <button id="endBtn" onclick="endGameNow()">End Game</button>
          </div>
        </div>
        <div id="winner_section" hidden>
          <img src="./Assests/Victory.png" />
          <p><span id="winner_name"></span> won the game!</p>
          <img src="./Assests/crackers.png" />
          <p><button onclick="startAnotherGame()">New Game</button></p>
        </div>
      </section>

      <div id="winnerModal" class="modal" hidden></div>
    </main>
    <footer>
      <button id="themeToggle" onclick="toggleTheme()">
        <span class="themeText">Switch to Dark Mode</span>
      </button>
      <p>&copy; Akash Kumar</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
